name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-gtk-3.0 python3-gi pulseaudio-utils
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v
